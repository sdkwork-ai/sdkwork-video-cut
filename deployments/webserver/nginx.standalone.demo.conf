# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/video_cut/webserver.pid;
error_log /var/log/sdkwork/video_cut/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name video-cut-demo.sdkwork.com video-cut-demo.birdcoder.com video-cut-demo.dtupay.com video-cut-demo.noaper.com video-cut-demo.sdkwork.cn video-cut-demo.birdcoder.cn video-cut-demo.dtupay.cn video-cut-demo.noaper.cn video-cut-demo.skubc.com video-cut-demo.skubc.cn video-cut-demo.zowalk.com video-cut-demo.zowalk.cn video-cut-demo.offer86.com video-cut-demo.offer86.cn video-cut-demo.86offer.com video-cut-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/video_cut/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
