# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/video_cut/webserver.pid;
error_log /var/log/sdkwork/video_cut/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name video-cut-test.sdkwork.com video-cut-test.birdcoder.com video-cut-test.dtupay.com video-cut-test.sdkwork.cn video-cut-test.birdcoder.cn video-cut-test.dtupay.cn video-cut-test.skubc.com video-cut-test.skubc.cn video-cut-test.zowalk.com video-cut-test.zowalk.cn video-cut-test.offer86.com video-cut-test.offer86.cn video-cut-test.86offer.com video-cut-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
